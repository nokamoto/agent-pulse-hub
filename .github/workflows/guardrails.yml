name: Guardrails

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/guardrails/**'
      - 'build/Magefile.go'
      - 'build/mage.go'
      - 'tools.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/guardrails.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tools/guardrails/**'
      - 'build/Magefile.go'
      - 'build/mage.go'
      - 'tools.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/guardrails.yml'

jobs:
  guardrails:
    name: Run Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Download Go dependencies
        run: go mod download

      - name: Run guardrails
        run: go run build/mage.go -d build -w . guardrails
