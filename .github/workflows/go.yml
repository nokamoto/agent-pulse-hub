name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go:
    name: Go CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate Go code
        run: go run build/mage.go -d build -w . generate

      - name: Format Go code and tidy modules
        run: go run build/mage.go -d build -w . format

      - name: Check generated code, formatting, and module files
        shell: bash
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "Run the Mage generate and format targets, then commit the resulting changes."
            printf '%s\n' "$status"
            git diff --exit-code
            exit 1
          fi

      - name: Run default Go tests and tooling unit tests
        run: go run build/mage.go -d build -w . test

      - name: Run Go lint
        run: go run build/mage.go -d build -w . lint

  product-integration:
    name: Product integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run all product integration suites
        env:
          APH_INTEGRATION_REPORT_DIR: ${{ runner.temp }}/product-integration
        run: go run build/mage.go -d build -w . integrationAll

      - name: Upload product integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-integration-windows
          path: ${{ runner.temp }}/product-integration
          if-no-files-found: error

  integration-tooling:
    name: Integration tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Qualify tagged runner and acceptance report gate
        env:
          APH_TOOLING_REPORT_DIR: ${{ runner.temp }}/integration-tooling
        run: go run build/mage.go -d build -w . integrationTooling

      - name: Upload tooling qualification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-tooling-${{ matrix.os }}
          path: ${{ runner.temp }}/integration-tooling
          if-no-files-found: error
